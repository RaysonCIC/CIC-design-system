  <title>Select | CIC Design System</title>
  <meta charset="utf-8">

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="/docs/css/docs.css">

<body>

<section class="CIC-section">
  <div class="CIC-container CIC-p-y-sm">
    <div class="CIC-layout">
      <main class="CIC-layout__main">
        
        <form id="form" class="CIC-form">
          <div class="CIC-form__group CIC-m-bottom-sm">
            <label class="CIC-form__label" for="select-all-savings-programs-test">Savings programs you would like to claim</label>
            <div class="CIC-multi-select js-multi-select" data-select-text="Select savings programs" data-multi-select-text="{n} savings programs selected" data-n-multi-select="2">
              <select name="select-all-savings-programs-test" id="select-all-savings-programs-test" multiple >
                <option value="Stay CIC voucher">Stay CIC voucher</option>
                <option value="Regional seniors travel card">Regional seniors travel card</option>
                <option value="Toll relief">Toll relief</option>
                <option value="First lap swimming voucher">First lap swimming voucher</option>
                <option value="Active kids voucher">Active kids voucher</option>
                <option value="Creative kids voucher">Creative kids voucher</option>
                <option value="Energy made easy">Energy made easy</option>
              </select>
            </div>  </div>
        
          <div class="CIC-form__group">
            <label class="CIC-form__label" for="select-all-savings-programs">Savings programs you would like to claim</label>
            <div class="CIC-multi-select js-multi-select" data-select-text="Select savings programs" data-multi-select-text="{n} savings programs selected" data-n-multi-select="2">
              <select name="select-all-savings-programs" id="select-all-savings-programs" multiple>
                <option value="Stay CIC voucher" selected="selected">Stay CIC voucher</option>
                <option value="Regional seniors travel card" selected="selected">Regional seniors travel card</option>
                <option value="Toll relief" selected="selected">Toll relief</option>
                <option value="First lap swimming voucher">First lap swimming voucher</option>
                <option value="Active kids voucher">Active kids voucher</option>
                <option value="Creative kids voucher">Creative kids voucher</option>
                <option value="Energy made easy">Energy made easy</option>
              </select>
            </div>
          </div>
        
          <div class="CIC-filters CIC-filters--down js-filters">
            <div class="CIC-filters__controls js-filters__count">
              <button>
                <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">tune</span>
                <span>Filters</span>
                <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_down</span>
              </button>
            </div>
            <div class="CIC-filters__wrapper">
              <div class="CIC-filters__title">Filters</div>
              <div class="CIC-filters__list">
                <div class="CIC-filters__item">
                  <button class="CIC-filters__item-button">
                    <span class="CIC-filters__item-name">Keyword</span>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_down</span>
                  </button>
                  <div class="CIC-filters__item-content">
                    <label class="CIC-form__label sr-only" for="filters-all-keyword-4">Keyword</label>
                    <input class="CIC-form__input" type="text" id="filters-all-keyword-4" name="filters-keyword" value="Digital Design System">
                  </div>
                </div>
                <div class="CIC-filters__item">
                  <button class="CIC-filters__item-button">
                    <span class="CIC-filters__item-name">Region</span>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_down</span>
                  </button>
                  <div class="CIC-filters__item-content">
                    <label class="CIC-form__label sr-only" for="filters-instant-regions-8">Region</label>
                    <div class="CIC-multi-select js-multi-select" data-select-text="Select regions" data-multi-select-text="{n} regions selected" data-n-multi-select="2">
                    <select name="filters-instant-regions-8" id="filters-instant-regions-8" multiple>
                      <option value="Central Coast" selected="true">Central Coast</option>
                      <option value="Central West &amp; Orana">Central West &amp; Orana</option>
                      <option value="Far West">Far West</option>
                      <option value="Hunter">Hunter</option>
                      <option value="Illawarra-Shoalhaven">Illawarra-Shoalhaven</option>
                      <option value="New England &amp; North West">New England &amp; North West</option>
                      <option value="North Coast">North Coast</option>
                      <option value="Riverina Murray">Riverina Murray</option>
                    </select>
                    </div>
                  </div>
                </div>
                <div class="CIC-filters__item">
                  <button class="CIC-filters__item-button">
                    <span class="CIC-filters__item-name">Categories</span>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_down</span>
                  </button>
                  <div class="CIC-filters__item-content">
                    <fieldset class="CIC-form__fieldset">
                      <legend class="CIC-form__legend sr-only">Categories</legend>
                      <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Customer Service" id="filters-instant-categories-0-8">
                      <label class="CIC-form__checkbox-label" for="filters-instant-categories-0-8">Customer Service</label>
                      <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Communities and Justice" id="filters-instant-categories-1-8">
                      <label class="CIC-form__checkbox-label" for="filters-instant-categories-1-8">Communities and Justice</label>
                      <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Education" id="filters-instant-categories-2-8">
                      <label class="CIC-form__checkbox-label" for="filters-instant-categories-2-8">Education</label>
                      <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Health" id="filters-instant-categories-3-8">
                      <label class="CIC-form__checkbox-label" for="filters-instant-categories-3-8">Health</label>
                      <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Planning" id="filters-instant-categories-4-8">
                      <label class="CIC-form__checkbox-label" for="filters-instant-categories-4-8">Planning</label>
                    </fieldset>
                  </div>
                </div>
                <div class="CIC-filters__item">
                  <button class="CIC-filters__item-button">
                    <span class="CIC-filters__item-name">Date</span>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_down</span>
                  </button>
                  <div class="CIC-filters__item-content">
                    <div class="CIC-form__group">
                      <fieldset class="CIC-form__date">
                        <legend class="CIC-form__label">Date published from:</legend>
                        <div class="CIC-form__date-wrapper">
                          <div class="CIC-form__date-input">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-4-day">Day</label>
                            <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-from-4-day" name="filters-all-date-from-4-day">
                          </div>
                          <div class="CIC-form__date-input">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-4-month">Month</label>
                            <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-from-4-month" name="filters-all-date-from-4-month">
                          </div>
                          <div class="CIC-form__date-input CIC-form__date-input--large">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-4-year">Year</label>
                            <input class="CIC-form__input" type="text" maxlength="4" id="filters-all-date-from-4-year" name="filters-all-date-from-4-year">
                          </div>
                        </div>
                      </fieldset>
                    </div>
                    <div class="CIC-form__group">
                      <fieldset class="CIC-form__date">
                        <legend class="CIC-form__label">Date published to:</legend>
                        <div class="CIC-form__date-wrapper">
                          <div class="CIC-form__date-input">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-4-day">Day</label>
                            <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-to-4-day" name="filters-all-date-to-4-day">
                          </div>
                          <div class="CIC-form__date-input">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-4-month">Month</label>
                            <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-to-4-month" name="filters-all-date-to-4-month">
                          </div>
                          <div class="CIC-form__date-input CIC-form__date-input--large">
                            <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-4-year">Year</label>
                            <input class="CIC-form__input" type="text" maxlength="4" id="filters-all-date-to-4-year" name="filters-all-date-to-4-year">
                          </div>
                        </div>
                      </fieldset>
                    </div>
                  </div>
                </div> 
              </div>
              <div class="CIC-filters__accept">
                <button type="submit" class="CIC-button CIC-button--dark CIC-button--full-width">Apply filters</button>
              </div>
              <div class="CIC-filters__cancel">
                <button type="reset">Clear all filters</button>
              </div>
            </div>
          </div>
        
          <div class="CIC-form__group">
            <fieldset class="CIC-form__fieldset">
              <legend>
                <span class="CIC-form__legend">Category</span>
              </legend>
              <input class="CIC-form__checkbox-input" type="checkbox" name="form-checkbox-multi-1" id="form-checkbox-multi-1-a"  >
              <label class="CIC-form__checkbox-label" for="form-checkbox-multi-1-a">Customer Service</label>
              <input class="CIC-form__checkbox-input" type="checkbox" name="form-checkbox-multi-1" id="form-checkbox-multi-1-b"  >
              <label class="CIC-form__checkbox-label" for="form-checkbox-multi-1-b">Communities and Justice</label>
            </fieldset>
        
            <div class="CIC-form__group CIC-m-bottom-sm">
              <label class="CIC-form__label" for="select-all-regions-1">Region</label>
                <select class="CIC-form__select" name="select-all-regions-1" id="select-all-regions-1" ><option value="">Please select</option>
                  <option value="Central Coast">Central Coast</option>
                  <option value="Central West &amp; Orana">Central West &amp; Orana</option>
                  <option value="Far West">Far West</option>
                  <option value="Hunter">Hunter</option>
                  <option value="Illawarra-Shoalhaven">Illawarra-Shoalhaven</option>
                  <option value="New England &amp; North West">New England &amp; North West</option>
                  <option value="North Coast">North Coast</option>
                  <option value="Riverina Murray">Riverina Murray</option>
                </select>    </div>
          </div>
        
          <div class="CIC-form__group">
            <label class="CIC-form__label" for="pet-select">Choose a pet:</label>
        
            <select name="pets" id="pet-select">
              <option value="">--Please choose an option--</option>
              <option value="dog">Dog</option>
              <option value="cat">Cat</option>
              <option value="hamster">Hamster</option>
              <option value="parrot">Parrot</option>
              <option value="spider">Spider</option>
              <option value="goldfish">Goldfish</option>
            </select>
          </div>
        
          <div class="CIC-form__group CIC-m-bottom-sm">
            <fieldset class="CIC-form__fieldset">
              <legend>
                <span class="CIC-form__legend">Choose your monster's features:</span>
              </legend>
        
              <div>
                <input type="checkbox" id="scales" name="scales">
                <label for="scales">Scales</label>
              </div>
        
              <div>
                <input type="checkbox" id="horns" name="horns">
                <label for="horns">Horns</label>
              </div>
        
              <div>
                <input type="checkbox" id="tentacles" name="tentacles">
                <label for="tentacles">Tentacles</label>
              </div>
        
              <div>
                <input type="checkbox" id="wings" name="wings">
                <label for="wings">Wings</label>
              </div>
            </fieldset>
          </div>
        
          <input type="submit" class="CIC-button CIC-button--dark" value="Submit">
        
          <p id="log"></p>
        </form>
        
        <script>
        function logSubmit(event) {
          event.preventDefault();
          const formData = new FormData(form);
        
          for (const [key, value] of formData) {
            log.innerHTML += `<pre>${key}: ${value}</pre>\n`;
          }
        }
        
        const form = document.querySelector("form");
        const log = document.getElementById("log");
        form.addEventListener("submit", logSubmit);
        </script>
        
      </main>
      <div class="CIC-layout__sidebar CIC-layout__sidebar--desktop"></div>
    </div>
  </div>
</section>

  <script src="/js/main.js"></script>
  <script src="/js/global-components.js"></script>
</body>
</html>
