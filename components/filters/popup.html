<section class="CIC-section">
  <div class="CIC-container CIC-p-y-sm">
    <div class="CIC-layout">
      <main class="CIC-layout__main">
        <div class="CIC-grid">
          <div class="CIC-col CIC-col-xl-4">
            <div class="CIC-docs__component">
              <div class="CIC-filters CIC-filters--instant">
                <div class="CIC-filters__wrapper">
                  <div class="CIC-filters__title">Filter results</div>
                  <div class="CIC-filters__list">
                    <div class="CIC-filters__item">
                      <label class="CIC-form__label" for="filters-instant-regions">Region</label>
                      <select class="CIC-form__select" id="filters-instant-regions" name="filters-instant-regions">
                        <option value="">Please select</option>
                        <option value="Central Coast">Central Coast</option>
                        <option value="Central West &amp; Orana">Central West &amp; Orana</option>
                        <option value="Far West">Far West</option>
                        <option value="Hunter">Hunter</option>
                        <option value="Illawarra-Shoalhaven">Illawarra-Shoalhaven</option>
                        <option value="New England &amp; North West">New England &amp; North West</option>
                        <option value="North Coast">North Coast</option>
                        <option value="Riverina Murray">Riverina Murray</option>
                      </select>
                    </div>
                    <div class="CIC-filters__item">
                      <fieldset class="CIC-form__fieldset">
                        <legend class="CIC-form__legend">Categories</legend>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Customer Service" id="filters-instant-categories-1">
                        <label class="CIC-form__checkbox-label" for="filters-instant-categories-1">Customer Service</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Communities and Justice" id="filters-instant-categories-2">
                        <label class="CIC-form__checkbox-label" for="filters-instant-categories-2">Communities and Justice</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Education" id="filters-instant-categories-3">
                        <label class="CIC-form__checkbox-label" for="filters-instant-categories-3">Education</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Health" id="filters-instant-categories-4">
                        <label class="CIC-form__checkbox-label" for="filters-instant-categories-4">Health</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-instant-categories" value="Planning" id="filters-instant-categories-5">
                        <label class="CIC-form__checkbox-label" for="filters-instant-categories-5">Planning</label>
                      </fieldset>
                    </div>
                  </div>
                  <div class="CIC-filters__cancel">
                    <button type="reset">Clear all filters</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="CIC-col CIC-col-xl-4">
            <div class="CIC-docs__component">
              <form class="CIC-filters CIC-filters--fixed js-filters">
                <div class="CIC-filters__controls">
                  <button>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">tune</span>
                    <span>Filter results</span>
                  </button>
                </div>
                <div class="CIC-filters__wrapper">
                  <div class="CIC-filters__back">
                    <button class="CIC-icon-button CIC-icon-button--flex js-close-sub-nav" type="button" aria-expanded="true" aria-controls="sub-nav-">
                      <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_left</span>
                      <span>Back</span>
                    </button>
                  </div>
                  <div class="CIC-filters__title">Filter results</div>
                  <div class="CIC-filters__list">
                    <div class="CIC-filters__item">
                      <label class="CIC-form__label" for="filters-batch-keyword">Keyword</label>
                      <input class="CIC-form__input" type="text" id="filters-batch-keyword" name="filters-keyword">
                    </div>
                    <div class="CIC-filters__item">
                      <label class="CIC-form__label" for="filters-batch-regions">Region</label>
                      <select class="CIC-form__select" id="filters-batch-regions" name="filters-batch-regions">
                        <option value="">Please select</option>
                        <option value="Central Coast">Central Coast</option>
                        <option value="Central West &amp; Orana">Central West &amp; Orana</option>
                        <option value="Far West">Far West</option>
                        <option value="Hunter">Hunter</option>
                        <option value="Illawarra-Shoalhaven">Illawarra-Shoalhaven</option>
                        <option value="New England &amp; North West">New England &amp; North West</option>
                        <option value="North Coast">North Coast</option>
                        <option value="Riverina Murray">Riverina Murray</option>
                      </select>
                    </div>
                    <div class="CIC-filters__item">
                      <fieldset class="CIC-form__fieldset">
                        <legend class="CIC-form__legend">Categories</legend>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-batch-categories" value="Customer Service" id="filters-batch-categories-1">
                        <label class="CIC-form__checkbox-label" for="filters-batch-categories-1">Customer Service</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-batch-categories" value="Communities and Justice" id="filters-batch-categories-2">
                        <label class="CIC-form__checkbox-label" for="filters-batch-categories-2">Communities and Justice</label>
                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-batch-categories" value="Education" id="filters-batch-categories-3">
                        <label class="CIC-form__checkbox-label" for="filters-batch-categories-3">Education</label>
                      </fieldset>
                    </div>
                  </div>
                  <div class="CIC-filters__accept">
                    <button type="submit" class="CIC-button CIC-button--dark CIC-button--full-width" disabled>Apply filters</button>
                  </div>
                  <div class="CIC-filters__cancel">
                    <button type="reset">Clear all filters</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <div class="CIC-col CIC-col-xl-4">
            <div class="CIC-docs__component">
              <form class="CIC-filters CIC-filters--fixed js-filters">
                <div class="CIC-filters__controls active">
                  <button>
                    <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">tune</span>
                    <span>Filter results (4)</span>
                  </button>
                </div>
                <div class="CIC-filters__wrapper">
                  <div class="CIC-filters__back">
                    <button class="CIC-icon-button CIC-icon-button--flex js-close-sub-nav" type="button" aria-expanded="true" aria-controls="sub-nav-">
                      <span class="material-icons CIC-material-icons" focusable="false" aria-hidden="true">keyboard_arrow_left</span>
                      <span>Back</span>
                    </button>
                  </div>
                  <div class="CIC-filters__title">Filter results</div>
                  <div class="CIC-filters__list">
                    <div class="CIC-filters__item">
                      <label class="CIC-form__label" for="filters-all-keyword">Keyword</label>
                      <input class="CIC-form__input" type="text" id="filters-all-keyword" name="filters-keyword" value="Digital Design System">
                    </div>
                    <div class="CIC-filters__item">
                      <label class="CIC-form__label" for="filters-all-regions">Region</label>
                      <select class="CIC-form__select" id="filters-all-regions" name="filters-all-regions">
                        <option value="">Please select</option>
                        <option value="Central Coast">Central Coast</option>
                        <option value="Central West &amp; Orana">Central West &amp; Orana</option>
                        <option value="Far West">Far West</option>
                        <option value="Hunter">Hunter</option>
                        <option value="Illawarra-Shoalhaven">Illawarra-Shoalhaven</option>
                        <option value="New England &amp; North West">New England &amp; North West</option>
                        <option value="North Coast">North Coast</option>
                        <option value="Riverina Murray">Riverina Murray</option>

                    <div class="CIC-filters__item">

                        <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Health" id="filters-all-categories-4">
                        <label class="CIC-form__checkbox-label" for="filters-all-categories-4">Health</label>
                        <div class="CIC-filters__all hidden">
                          <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Planning" id="filters-all-categories-5">
                          <label class="CIC-form__checkbox-label" for="filters-all-categories-5">Planning</label>
                          <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Premier and Cabinet" id="filters-all-categories-6">
                          <label class="CIC-form__checkbox-label" for="filters-all-categories-6">Premier and Cabinet</label>
                          <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Regional CIC" id="filters-all-categories-7">
                          <label class="CIC-form__checkbox-label" for="filters-all-categories-7">Regional CIC</label>
                          <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Transport" id="filters-all-categories-8">
                          <label class="CIC-form__checkbox-label" for="filters-all-categories-8">Transport</label>
                          <input class="CIC-form__checkbox-input" type="checkbox" name="filters-all-categories" value="Treasury" id="filters-all-categories-9">
                          <label class="CIC-form__checkbox-label" for="filters-all-categories-9">Treasury</label>
                        </div>
                        <button class="CIC-filters__more">Show all categories (9)</button>
                      </fieldset>
                    </div>
                    <div class="CIC-filters__item">
                      <div class="CIC-form__group">
                        <fieldset class="CIC-form__date">
                          <legend class="CIC-form__label">Date published from:</legend>
                          <div class="CIC-form__date-wrapper">
                            <div class="CIC-form__date-input">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-day">Day</label>
                              <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-from-day" name="filters-all-date-from-day">
                            </div>
                            <div class="CIC-form__date-input">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-month">Month</label>
                              <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-from-month" name="filters-all-date-from-month">
                            </div>
                            <div class="CIC-form__date-input CIC-form__date-input--large">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-from-year">Year</label>
                              <input class="CIC-form__input" type="text" maxlength="4" id="filters-all-date-from-year" name="filters-all-date-from-year">
                            </div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="CIC-form__group">
                        <fieldset class="CIC-form__date">
                          <legend class="CIC-form__label">Date published to:</legend>
                          <div class="CIC-form__date-wrapper">
                            <div class="CIC-form__date-input">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-day">Day</label>
                              <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-to-day" name="filters-all-date-to-day">
                            </div>
                            <div class="CIC-form__date-input">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-month">Month</label>
                              <input class="CIC-form__input" type="text" maxlength="2" id="filters-all-date-to-month" name="filters-all-date-to-month">
                            </div>
                            <div class="CIC-form__date-input CIC-form__date-input--large">
                              <label class="CIC-form__label CIC-form__label--small" for="filters-all-date-to-year">Year</label>
                              <input class="CIC-form__input" type="text" maxlength="4" id="filters-all-date-to-year" name="filters-all-date-to-year">
                            </div>
                          </div>
                        </fieldset>
                      </div>
                    </div>
                  </div>
                  <div class="CIC-filters__accept">
                    <button type="submit" class="CIC-button CIC-button--dark CIC-button--full-width">Apply filters</button>
                  </div>
                  <div class="CIC-filters__cancel">
                    <button type="reset">Clear all filters</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
