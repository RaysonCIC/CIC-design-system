  <link rel="stylesheet" href="/docs/css/docs.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.0.1/dist/cookieconsent.css">

      h.hj = h.hj || function () { (h.hj.q = h.hj.q || []).push(arguments) };

<body>

<section class="CIC-section">
  <div class="CIC-container CIC-p-y-sm">
    <div class="CIC-layout">
      <main class="CIC-layout__main">
        
        <form id="form" class="CIC-form">
        
          <div class="CIC-form__group CIC-m-bottom-lg">
            <label class="CIC-form__label" for="file-upload">Upload files</label>
            <span class="CIC-form__helper" id="file-upload-helper-text">Formats accepted: JPG, PNG or PDF <br /> File size must not exceed 350MB</span>
            <div class="CIC-file-upload js-file-upload">
                <input id="file-upload" type="file" class="CIC-file-upload__input" name="file-upload" aria-describedby="file-upload-helper-text" accept="image/*,.pdf" multiple>
                <label for="file-upload" class="CIC-file-upload__label CIC-button CIC-button--dark-outline-solid">Select file</label>
            </div>
          </div>
        
          <input type="submit" class="CIC-button CIC-button--dark" value="Submit">
        
          <p id="log"></p>
        </form>
        
        <script>
        function logSubmit(event) {
          event.preventDefault();
          const form = event.target; // Reference the form
          const formData = new FormData(form);
        
          log.innerHTML = ""; // Clear previous log output
        
          for (const [key, value] of formData.entries()) {
            if (value instanceof File && value.name) {
              log.innerHTML += `<pre>${key}:
          Name: ${value.name}
          Size: ${value.size} bytes
          Type: ${value.type}</pre>\n`;
            } else {
              log.innerHTML += `<pre>${key}: ${value}</pre>\n`;
            }
          }
        
          form.reset(); // Clear the form
        }
        
        const form = document.querySelector("form");
        const log = document.getElementById("log");
        form.addEventListener("submit", logSubmit);
        </script>
        
      </main>
      <div class="CIC-layout__sidebar CIC-layout__sidebar--desktop"></div>
    </div>
  </div>
</section>

  <script src="/js/main.js"></script>
  <script src="/js/global-components.js"></script>
</body>
</html>
