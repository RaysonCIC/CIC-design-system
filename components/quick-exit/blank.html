  <script data-category="analytics">
    (function (h, o, t, j, a, r) {
      h.hj = h.hj || function () { (h.hj.q = h.hj.q || []).push(arguments) };

<body>


<section class="CIC-section">
  <div class="CIC-container CIC-p-y-sm">
    <div class="CIC-layout">
      <main class="CIC-layout__main">
        <h3>Quick exit feature</h3>
        <ul class="CIC-m-bottom-md">
        <li>Cloaks page immediately on activation</li>
        <li>Navigates the current tab to the Safe URL and places a `display: none` on the current page, also replacing the page title</li>
        </ul>
        
        <button class="CIC-button CIC-button--dark" data-module="quick-exit" type="button">View banner</button>
        
        <script>
          (function () {
            if (typeof document === 'undefined') return;
            document.addEventListener('DOMContentLoaded', function () {
              var btn = document.querySelector('[data-module="quick-exit"]');
              if (!btn || !window.CIC || !window.CIC.QuickExit) return;
        
              btn.addEventListener('click', function () {
                window.CIC.QuickExit.init({
                  safeUrl: "https://www.google.com/webhp",
                  description: "Leave quickly using this banner or press <kbd aria-label='Escape key'>Esc</kbd> 2 times.",
                  enableEsc: true,
                  enableCloak: true
                });
        
              });
            });
          }());
        </script>
      </main>
      
    </div>
  </div>
</section>
<script src="/docs/js/docs.js"></script>
